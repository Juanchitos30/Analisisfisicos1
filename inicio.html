<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #4A90E2;
    --azul-oscuro: #2f6fc4;
    --navy: #24344d;
    --navy-suave: #34495e;
    --gris-texto: #4a4f57;
    --gris-borde: #d7dbe2;
    --etiqueta-fondo: #eaf1fb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #eef1f8 0%, #f4f4f9 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px 16px;
    color: var(--gris-texto);
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    padding: 38px 34px;
    border-radius: 18px;
    box-shadow: 0 16px 40px rgba(30, 41, 59, 0.14);
    border: 1px solid rgba(0,0,0,0.04);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  .logo-circulo {
    width: 54px;
    height: 54px;
    margin: 0 auto 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(36, 52, 77, 0.28);
  }
  .logo-circulo svg { width: 28px; height: 28px; }
  h2 {
    margin: 0 0 4px 0;
    color: #1f2430;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .subtitulo {
    margin: 0 0 26px 0;
    font-size: 13px;
    color: #8a90a0;
    font-weight: 500;
  }
  .menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .menu button {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 10px;
    background: #fbfbfd;
    color: #1f2430;
    border: 1.5px solid var(--gris-borde);
    border-radius: 12px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, box-shadow 0.18s ease;
  }
  .menu button .icono-envoltura {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--etiqueta-fondo);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.18s ease;
  }
  .menu button svg {
    width: 22px;
    height: 22px;
    stroke: var(--azul-oscuro);
    transition: stroke 0.18s ease;
  }
  .menu button:hover {
    background: #fff;
    border-color: var(--azul);
    box-shadow: 0 8px 18px rgba(74, 144, 226, 0.18);
    transform: translateY(-2px);
  }
  .menu button:hover .icono-envoltura {
    background: var(--azul);
  }
  .menu button:hover svg {
    stroke: #fff;
  }
  .menu button:active {
    transform: translateY(0);
  }
  .salir {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--gris-borde);
  }
  .salir a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #8a90a0;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    transition: color 0.15s ease;
  }
  .salir a:hover {
    color: #e74c3c;
  }
  .salir svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo-circulo">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 9.5 12 3l9 6.5"></path>
      <path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"></path>
    </svg>
  </div>
  <h2>Menú principal</h2>
  <p class="subtitulo">Selecciona una sección para continuar</p>

  <div class="menu">
    <button onclick="window.location.href='consultar-lotes2.html'">
      <span class="icono-envoltura">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
      </span>
      Consultar Lotes
    </button>
    <button onclick="window.location.href='agregar-informacion.html'">
      <span class="icono-envoltura">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <path d="M14 2v6h6"></path>
          <path d="M12 12v6"></path>
          <path d="M9 15h6"></path>
        </svg>
      </span>
      Agregar Información
    </button>
    <button onclick="window.location.href='ensaque.html'">
      <span class="icono-envoltura">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 3h5l1 3h-7z"></path>
          <path d="M7.2 6c-1.7 3.3-2.3 6.6-1.7 10 .6 3.2 2.8 5 6.5 5s5.9-1.8 6.5-5c.6-3.4 0-6.7-1.7-10z"></path>
          <ellipse cx="12" cy="13.5" rx="1.7" ry="2.6"></ellipse>
          <path d="M12 11v5"></path>
        </svg>
      </span>
      Ensaque
    </button>
    <button onclick="window.location.href='trilla.html'">
      <span class="icono-envoltura">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3.5 2"></path>
        </svg>
      </span>
      Trilla
    </button>
  </div>

  <div class="salir">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <path d="M16 17l5-5-5-5"></path>
        <path d="M21 12H9"></path>
      </svg>
      Cerrar sesión
    </a>
  </div>
</div>

</body>
</html>
