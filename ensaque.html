<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Diario de Ensacado de Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #4A90E2;
    --azul-oscuro: #2f6fc4;
    --navy: #24344d;
    --navy-suave: #34495e;
    --gris-texto: #4a4f57;
    --gris-borde: #d7dbe2;
    --etiqueta-fondo: #eaf1fb;
    --etiqueta-texto: #1f3a5f;
    --verde: #2ecc71;
    --verde-oscuro: #27ae60;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #eef1f8 0%, #f4f4f9 100%);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 32px 16px;
    color: var(--gris-texto);
    -webkit-font-smoothing: antialiased;
  }
  .contenedor {
    width: 100%;
    max-width: 640px;
  }

  /* ==== Encabezado ==== */
  .encabezado {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .logo-circulo {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(36, 52, 77, 0.28);
  }
  .logo-circulo svg { width: 24px; height: 24px; }
  .encabezado-texto { text-align: left; }
  h1 {
    margin: 0;
    color: #1f2430;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .encabezado-texto p {
    margin: 2px 0 0 0;
    font-size: 13px;
    color: #8a90a0;
    font-weight: 500;
  }

  /* ==== Tarjetas ==== */
  .card {
    background: #fff;
    padding: 28px 30px;
    border-radius: 16px;
    box-shadow: 0 14px 36px rgba(30, 41, 59, 0.1);
    border: 1px solid rgba(0,0,0,0.04);
    margin-bottom: 18px;
  }
  .seccion-titulo {
    margin-bottom: 16px;
    font-size: 12.5px;
    font-weight: 700;
    color: #8a90a0;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .seccion-titulo::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--gris-borde);
  }

  .fila-dos-columnas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .campo { }
  label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
    font-weight: 600;
    color: #5b6070;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type="date"], input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--gris-borde);
    border-radius: 8px;
    font-size: 14px;
    color: #1f2430;
    background: #fff;
    font-family: inherit;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input[type="date"]:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
  }
  .fila-fecha {
    display: flex;
    gap: 8px;
  }
  .fila-fecha input { flex: 1; }
  .btn-hoy {
    padding: 0 14px;
    background: var(--azul);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    font-family: inherit;
    transition: background 0.15s ease;
  }
  .btn-hoy:hover { background: var(--azul-oscuro); }

  .btn-guardar {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 12px rgba(74, 144, 226, 0.32);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .btn-guardar:hover {
    background: var(--azul-oscuro);
    box-shadow: 0 6px 16px rgba(74, 144, 226, 0.4);
  }
  #mensaje {
    margin-top: 12px;
    text-align: center;
    font-size: 13.5px;
    font-weight: 500;
    min-height: 18px;
  }

  /* ==== Total destacado ==== */
  .card-total {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 30px;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
    color: #fff;
    box-shadow: 0 14px 36px rgba(36, 52, 77, 0.22);
    text-align: center;
  }
  .card-total .etiqueta-total {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.7);
  }
  .card-total .valor-total {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .btn-volver {
    width: 100%;
    margin-top: 4px;
    padding: 11px;
    background: transparent;
    color: #8a90a0;
    border: 1.5px solid var(--gris-borde);
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .btn-volver:hover {
    color: var(--azul-oscuro);
    border-color: var(--azul);
  }

  @media (max-width: 560px) {
    .fila-dos-columnas { grid-template-columns: 1fr; }
    .card { padding: 22px 20px; }
  }
</style>
</head>
<body>

<div class="contenedor">

  <div class="encabezado">
    <div class="logo-circulo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 3h5l1 3h-7z"></path>
        <path d="M7.2 6c-1.7 3.3-2.3 6.6-1.7 10 .6 3.2 2.8 5 6.5 5s5.9-1.8 6.5-5c.6-3.4 0-6.7-1.7-10z"></path>
        <ellipse cx="12" cy="13.5" rx="1.7" ry="2.6"></ellipse>
        <path d="M12 11v5"></path>
      </svg>
    </div>
    <div class="encabezado-texto">
      <h1>Control Diario de Ensacado</h1>
      <p>Registra y consulta los sacos de café ensacados</p>
    </div>
  </div>

  <div class="card">
    <div class="seccion-titulo">Nuevo registro</div>
    <div class="fila-dos-columnas">
      <div class="campo">
        <label for="fecha">Fecha</label>
        <div class="fila-fecha">
          <input type="date" id="fecha">
          <button type="button" id="btnFechaHoy" class="btn-hoy">📅 Hoy</button>
        </div>
      </div>
      <div class="campo">
        <label for="sacos">Cantidad de sacos</label>
        <input type="number" id="sacos" placeholder="Ej: 25" min="0">
      </div>
    </div>
    <button class="btn-guardar" onclick="guardarRegistro()">Guardar registro</button>
    <div id="mensaje"></div>
  </div>

  <div class="card card-total">
    <div class="texto-total">
      <div class="etiqueta-total">Total sacos registrados</div>
      <div class="valor-total" id="totalSacos">0</div>
    </div>
  </div>



</div>

<script>
  const inputFecha = document.getElementById('fecha');
  const inputSacos = document.getElementById('sacos');
  const mensaje = document.getElementById('mensaje');

  inputFecha.valueAsDate = new Date();

  document.getElementById('btnFechaHoy').addEventListener('click', function() {
    inputFecha.valueAsDate = new Date();
  });

  // ==== Guardado local ====
  // Los registros se guardan en localStorage bajo la clave "ensacadoCafe",
  // por lo que quedan disponibles aunque se cierre o recargue la página,
  // sin necesidad de conexión a internet.
  let registros = JSON.parse(localStorage.getItem('ensacadoCafe')) || [];

  function guardarRegistro() {
    const fecha = inputFecha.value;
    const sacos = inputSacos.value;

    if (!fecha || !sacos) {
      mensaje.style.color = '#e74c3c';
      mensaje.textContent = 'Completa todos los campos.';
      return;
    }

    registros.push({
      fecha: fecha,
      sacos: Number(sacos)
    });

    localStorage.setItem('ensacadoCafe', JSON.stringify(registros));

    inputSacos.value = '';
    mensaje.style.color = '#27ae60';
    mensaje.textContent = 'Registro guardado correctamente.';

    actualizarTotal();
  }

  function actualizarTotal() {
    const total = registros.reduce(function(suma, registro) {
      return suma + registro.sacos;
    }, 0);
    document.getElementById('totalSacos').textContent = total;
  }

  actualizarTotal();
</script>

</body>
</html>
