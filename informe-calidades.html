<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe de Calidades — vista HTML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #4A90E2;
    --azul-oscuro: #2f6fc4;
    --navy: #24344d;
    --navy-suave: #34495e;
    --azul-g1: #cfe0f5;
    --menta-g1-parcial: #dcf3e6;
    --durazno-g2: #fbe6d2;
    --azul-muestra-1: #3d6fb4;
    --azul-muestra-2: #2c5aa0;
    --texto-etiqueta: #1f3a5f;
    --etiqueta-fondo: #eaf1fb;
    --borde: #dbe1ea;
    --borde-grueso: #24344d;
    --bg-pagina-1: #eef1f8;
    --bg-pagina-2: #f4f4f9;
    --rojo-faltas: #c0392b;
  }

  * { box-sizing: border-box; }

  body {
    background: linear-gradient(180deg, var(--bg-pagina-1) 0%, var(--bg-pagina-2) 100%);
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    color: #333a45;
    margin: 0;
    padding: 36px 0 60px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Carril de desplazamiento lateral: aquí adentro es donde se hace scroll
     horizontal. Su ancho nunca invade el espacio de los botones fijos de
     la derecha, así que las flechas y la lupa jamás quedan sobre la tabla,
     sin importar cuánto te desplaces hacia los lados. */
  .scroll-horizontal {
    display: flex;
    justify-content: center;
    overflow-x: auto;
    margin: 0 90px 0 24px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .scroll-horizontal::-webkit-scrollbar {
    display: none;
    height: 0;
  }

  h1 {
    font-size: 26px;
    margin: 0 0 4px;
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .subtitulo {
    color: #8a90a0;
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 20px;
    text-align: center;
  }

  .contenedor-principal {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }

  .lote-envoltura {
    width: 100%;
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 26px rgba(36, 52, 77, 0.25);
    padding: 4px;
    margin-bottom: 26px;
    box-sizing: border-box;
  }

  .lote-header {
    font-weight: 700;
    font-size: clamp(16px, 5vw, 24px);
    text-align: center;
    padding: 12px 24px;
    box-sizing: border-box;
    color: #ffffff;
    letter-spacing: 0.04em;
  }

  .cuadricula {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px 42px;
    justify-content: center;
    margin-bottom: 18px;
  }

  /* Envoltorio de cada ficha: bordes bien redondeados y sombra suave,
     sin tocar ni los colores ni el contenido de la tabla de adentro.
     La sombra y el radio van en este contenedor (sin overflow:hidden,
     para que la sombra nunca se recorte); el recorte de las esquinas
     de la tabla lo hace el div interior .ficha-interior. */
  .ficha-envoltura {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 8px 22px rgba(30, 41, 59, 0.10);
    border: 1px solid rgba(20, 30, 50, 0.05);
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .ficha-envoltura:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(30, 41, 59, 0.16);
  }

  .ficha-interior {
    border-radius: 18px;
    overflow: hidden;
    padding: 14px;
  }

  table.ficha {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
  }

  table.ficha col.label   { width: 32%; }
  table.ficha col.valor   { width: 20%; }
  table.ficha col.malla-l { width: 24%; }
  table.ficha col.malla-v { width: 24%; }

  table.ficha td {
    border: 1px solid var(--borde);
    height: auto;
    min-height: 30px;
    padding: 5px 6px;
    font-size: clamp(12px, 3.6vw, 17px);
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
  }

  table.ficha td.vacia { border: 1px solid var(--borde); background: #fbfbfd; }

  /* Encabezado con el nombre de la muestra */
  td.muestra {
    background: linear-gradient(135deg, var(--azul-muestra-1) 0%, var(--azul-muestra-2) 100%);
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.03em;
    border: none;
    padding: 9px 6px;
  }

  /* Grupo 1 */
  td.g1 {
    background: var(--azul-g1);
    color: var(--texto-etiqueta);
    font-weight: 700;
  }

  /* Grupo 1 - campos "parcial" */
  td.g1-parcial {
    background: var(--menta-g1-parcial);
    color: var(--texto-etiqueta);
    font-weight: 700;
  }

  /* Grupo 2 */
  td.g2 {
    background: var(--durazno-g2);
    color: var(--texto-etiqueta);
    font-weight: 700;
  }

  /* Valores numéricos: sin negrita, sin color de relleno */
  td.valor {
    font-weight: 500;
    background: #ffffff;
    color: #333a45;
  }

  /* Encabezado de Granulometría */
  td.granulometria-header {
    font-weight: 700;
    background: var(--etiqueta-fondo);
    color: var(--texto-etiqueta);
    letter-spacing: 0.02em;
  }

  td.malla-label {
    font-weight: 700;
    background: #fbfbfd;
    color: var(--texto-etiqueta);
  }

  td.malla-valor {
    font-weight: 500;
    background: #ffffff;
    color: #333a45;
  }

  /* Filas G1 / G2 (peso), sin color de fondo */
  td.peso-label {
    font-weight: 700;
    background: #f4f6fa;
    color: var(--texto-etiqueta);
  }
  td.peso-valor {
    font-weight: 700;
    background: #f4f6fa;
    color: #333a45;
  }

  /* FALTAS: fila destacada como resultado final de la ficha */
  td.faltas-label,
  td.faltas-valor {
    font-weight: 800;
    background: var(--etiqueta-fondo);
    color: var(--rojo-faltas);
    border-top: 2px solid var(--borde-grueso);
  }

  /* Íconos fijos a la derecha, centrados horizontalmente en la franja reservada */
  .navegacion-vertical {
    position: fixed;
    right: 24px;
    bottom: 90px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 20;
  }

  .navegacion-vertical button {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    color: #ffffff;
    box-shadow: 0 6px 16px rgba(47, 111, 196, 0.35);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .navegacion-vertical button:hover {
    transform: translateY(-2px) scale(1.04);
    box-shadow: 0 8px 20px rgba(47, 111, 196, 0.45);
  }

  .navegacion-vertical svg {
    width: 20px;
    height: 20px;
  }

  /* Botón de lupa: mismo estilo que las flechas, se agrega debajo de ellas */
  .btn-lupa {
    position: relative;
  }

  .btn-lupa.activo {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
  }

  /* Barra lateral de zoom: aparece junto al botón de lupa al presionarlo */
  .panel-zoom {
    position: fixed;
    right: 78px;
    bottom: 150px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(30, 41, 59, 0.2);
    border: 1px solid rgba(20, 30, 50, 0.05);
    padding: 11px 18px;
    display: none;
    flex-direction: row;
    align-items: center;
    gap: 10px;
    z-index: 25;
  }

  .panel-zoom.visible {
    display: flex;
  }

  .panel-zoom .zoom-etiqueta {
    font-size: 11px;
    font-weight: 700;
    color: var(--azul-oscuro);
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    letter-spacing: 0.05em;
  }

  .panel-zoom input[type="range"] {
    width: 140px;
    height: 6px;
    accent-color: var(--azul);
    cursor: pointer;
  }

  .panel-zoom .zoom-valor {
    font-size: 13px;
    font-weight: 700;
    color: var(--azul-oscuro);
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    min-width: 34px;
    text-align: center;
  }

  /* Botón de buscador de lotes: mismo estilo, va debajo del zoom */
  .btn-buscar {
    position: relative;
  }

  .btn-buscar.activo {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%);
  }

  /* Fondo oscuro detrás de la ventana flotante de búsqueda */
  .overlay-buscar {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 30;
    backdrop-filter: blur(2px);
  }

  .overlay-buscar.visible {
    display: flex;
  }

  /* Ventana flotante de búsqueda */
  .panel-buscar {
    position: relative;
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.3);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 13px;
    width: 320px;
    max-width: 90vw;
  }

  .panel-buscar-titulo {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .btn-cerrar-buscar {
    border: none;
    background: transparent;
    font-size: 22px;
    line-height: 1;
    color: #9aa1b0;
    cursor: pointer;
    padding: 0 2px;
    border-radius: 50%;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .btn-cerrar-buscar:hover {
    color: var(--azul-oscuro);
    background: var(--etiqueta-fondo);
  }

  .panel-buscar-fila {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  .panel-buscar input[type="text"] {
    flex: 1;
    height: 38px;
    border: 1.5px solid var(--borde);
    border-radius: 9px;
    padding: 0 12px;
    font-size: 14px;
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .panel-buscar input[type="text"]:focus {
    border-color: var(--azul);
    box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
  }

  .btn-ejecutar-buscar {
    height: 38px;
    padding: 0 16px;
    border: none;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    cursor: pointer;
    transition: box-shadow 0.15s ease;
  }

  .btn-ejecutar-buscar:hover {
    box-shadow: 0 6px 16px rgba(47, 111, 196, 0.35);
  }

  .panel-buscar .buscar-info {
    font-size: 12px;
    font-weight: 700;
    color: var(--azul-oscuro);
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
  }

  /* Ficha oculta cuando no coincide con la búsqueda */
  .ficha-envoltura.oculta,
  .lote-envoltura.oculta,
  .grupo-lote.oculta {
    display: none;
  }

  /* Envuelve el encabezado "LOTE XXXX" junto con su cuadrícula de
     fichas, para poder mostrar/ocultar un lote completo de una sola
     vez al buscar. */
  .grupo-lote {
    width: 100%;
  }

  /* Texto de estado (cargando / cantidad de muestras encontradas /
     sin resultados), arriba de las fichas. */
  .estado-informe {
    color: #8a90a0;
    font-size: 14px;
    text-align: center;
    margin: 0 24px 18px;
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
    font-weight: 500;
  }

  .mensaje-vacio {
    color: #9aa1b0;
    font-size: 15px;
    text-align: center;
    margin: 40px 24px;
    font-family: 'Inter', Calibri, "Segoe UI", Arial, sans-serif;
  }

  /* Pantallas angostas (celulares): se reduce el margen reservado para
     los botones fijos y se achica un poco el texto de las tablas para
     que las fichas quepan sin necesidad de hacer scroll lateral. */
  @media (max-width: 600px) {
    .scroll-horizontal {
      margin: 0 56px 0 8px;
    }

    .ficha-envoltura {
      max-width: 100%;
    }

    table.ficha td {
      padding: 3px 4px;
    }

    .navegacion-vertical {
      right: 10px;
      bottom: 70px;
    }

    .navegacion-vertical button {
      width: 38px;
      height: 38px;
    }

    .panel-zoom {
      right: 54px;
    }
  }

</style>
</head>
<body>

  <p class="estado-informe" id="estadoInforme"></p>

  <div class="scroll-horizontal">
  <div class="contenedor-principal" id="contenedorPrincipal">
  </div>
  </div>


  <div class="navegacion-vertical">
    <button type="button" id="btnLoteAnterior" title="Lote anterior" onclick="loteAnterior()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
    </button>
    <button type="button" id="btnLoteSiguiente" title="Lote siguiente" onclick="loteSiguiente()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
    </button>
    <button type="button" id="btnLupa" class="btn-lupa" title="Zoom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
    </button>
    <button type="button" id="btnBuscar" class="btn-buscar" title="Buscar lote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </button>
  </div>

  <div class="panel-zoom" id="panelZoom">
    <span class="zoom-etiqueta">ZOOM</span>
    <input type="range" id="sliderZoom" min="0" max="100" step="5" value="100">
    <span class="zoom-valor" id="zoomValor">100%</span>
  </div>

  <div class="overlay-buscar" id="overlayBuscar">
    <div class="panel-buscar" id="panelBuscar">
      <div class="panel-buscar-titulo">
        Buscar lote
        <button type="button" id="btnCerrarBuscar" class="btn-cerrar-buscar" title="Cerrar" aria-label="Cerrar">&times;</button>
      </div>
      <div class="panel-buscar-fila">
        <input type="text" id="inputBuscar" placeholder="Ej: LOTE 4521 o 4521...">
      </div>
      <span class="buscar-info" id="buscarInfo"></span>
    </div>
  </div>

  <script>
    // ==== Datos ====
    // Esta página YA NO se conecta a Supabase: muestra exactamente las
    // fichas que estaban en pantalla en "Consultar Lotes" en el momento
    // en que se presionó el botón "Calidades". Esos datos se guardan en
    // localStorage (misma información, sin recalcular ni volver a
    // consultar nada) y aquí solo se leen y se dibujan.
    const CLAVE_LOCALSTORAGE = 'informeCalidadesDatos';

    // Mismos grupos y etiquetas abreviadas que usa "Consultar Lotes",
    // para que el orden y los nombres de cada grano queden idénticos.
    const GRUPO1 = [
      ['g1_negro'], ['g1_rojo'], ['g1_vinagre'], ['g1_mantequillo'], ['g1_reposado'],
      ['g1_cardenillo'], ['g1_piedras'], ['g1_guayaba'],
      ['g1_negroparcial'], ['g1_vinagreparcial'], ['g1_cardenilloparcial']
    ];
    const GRUPO2 = [
      ['g2_partidos'], ['g2_pasilla'], ['g2_concha'], ['g2_blanco'], ['g2_aplastados'],
      ['g2_vano'], ['g2_averanado'], ['g2_brocados'], ['g2_brocaspunto']
    ];
    const MALLA = [
      ['malla_18'], ['malla_17'], ['malla_16'], ['malla_15'],
      ['malla_14'], ['malla_13'], ['malla_12'], ['malla_0']
    ];
    const ETIQUETAS_GRANO = {
      g1_negro: 'Ng', g1_rojo: 'Rj', g1_vinagre: 'Vin', g1_mantequillo: 'Mnt',
      g1_reposado: 'Rep', g1_cardenillo: 'Crd', g1_piedras: 'P/P/O', g1_guayaba: 'Gy',
      g1_negroparcial: 'Ng.P', g1_vinagreparcial: 'Vin.P', g1_cardenilloparcial: 'Crd.P',
      g2_partidos: 'Part', g2_pasilla: 'Pas', g2_concha: 'Cnch', g2_blanco: 'Bl.Dec',
      g2_aplastados: 'Apl', g2_vano: 'Vano', g2_averanado: 'Aver', g2_brocados: 'Broc',
      g2_brocaspunto: 'BRP'
    };
    const ETIQUETAS_MALLA = {
      malla_18: '18', malla_17: '17', malla_16: '16', malla_15: '15',
      malla_14: '14', malla_13: '13', malla_12: '12', malla_0: '0'
    };

    // Lee un campo de la ficha tal cual llegó (el mismo valor que se veía
    // en pantalla en "Consultar Lotes", ya formateado: mallas ya
    // divididas si correspondía, Humedad/1G/2G con su sufijo, etc.).
    function val(ficha, campo) {
      const v = ficha[campo];
      return (v === undefined || v === null) ? '' : String(v).trim();
    }

    // Quita el símbolo % o la letra "g" que "Consultar Lotes" agrega a
    // 1G/2G en pantalla, para mostrar aquí un número limpio.
    function quitarSufijo(texto) {
      return (texto || '').toString().trim().replace(/%$/, '').replace(/[gG]$/, '').trim();
    }

    function escaparHTML(texto) {
      const div = document.createElement('div');
      div.textContent = texto === undefined || texto === null ? '' : String(texto);
      return div.innerHTML;
    }

    // Compara dos valores de lote de menor a mayor (numérico si ambos lo
    // son; si no, alfabético), igual que en "Consultar Lotes".
    function compararLotesAscendente(loteA, loteB) {
      const numA = parseFloat((loteA || '').toString().trim().replace(',', '.'));
      const numB = parseFloat((loteB || '').toString().trim().replace(',', '.'));
      if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
      return (loteA || '').toString().trim().localeCompare((loteB || '').toString().trim(), 'es', { numeric: true, sensitivity: 'base' });
    }

    // Construye la "tarjeta" HTML de una muestra (misma tabla de
    // siempre), mostrando SOLO los granos y mallas que tienen valor en
    // esa ficha, con el mismo layout de "Consultar Lotes": granos
    // (Grupo 1 y luego Grupo 2) en la columna izquierda, Granulometría
    // en la derecha, seguido de "G1=", "G2=" y FALTAS. Los valores se
    // muestran tal cual llegaron (sin recalcular nada).
    function crearTarjetaFicha(ficha) {
      const presentG1 = GRUPO1.filter(function(item) { return val(ficha, item[0]) !== ''; });
      const presentG2 = GRUPO2.filter(function(item) { return val(ficha, item[0]) !== ''; });
      const presentMalla = MALLA.filter(function(item) { return val(ficha, item[0]) !== ''; });

      const nG1 = presentG1.length;
      const nG2 = presentG2.length;
      const nMalla = presentMalla.length;
      const filasGranulometria = nMalla > 0 ? 1 + nMalla : 0;
      const filasCuerpo = Math.max(nG1 + nG2, filasGranulometria);

      const pesoG1 = quitarSufijo(val(ficha, 'valor_1g'));
      const pesoG2 = quitarSufijo(val(ficha, 'valor_2g'));
      const humedad = val(ficha, 'humedad');

      let filasHTML = '';
      for (let i = 0; i < filasCuerpo; i++) {
        let labelHTML, valorHTML;
        if (i < nG1) {
          const item = presentG1[i];
          const esParcial = item[0].indexOf('parcial') !== -1;
          labelHTML = '<td class="' + (esParcial ? 'g1-parcial' : 'g1') + '">' + escaparHTML(ETIQUETAS_GRANO[item[0]] || item[0]) + '</td>';
          valorHTML = '<td class="valor">' + escaparHTML(val(ficha, item[0])) + '</td>';
        } else if (i - nG1 < nG2) {
          const item = presentG2[i - nG1];
          labelHTML = '<td class="g2">' + escaparHTML(ETIQUETAS_GRANO[item[0]] || item[0]) + '</td>';
          valorHTML = '<td class="valor">' + escaparHTML(val(ficha, item[0])) + '</td>';
        } else {
          labelHTML = '<td class="vacia"></td>';
          valorHTML = '<td class="vacia"></td>';
        }

        let mallaLabelHTML, mallaValorHTML;
        if (i === 0 && nMalla > 0) {
          mallaLabelHTML = '<td class="granulometria-header" colspan="2">Granulometria</td>';
          mallaValorHTML = '';
        } else if (nMalla > 0 && (i - 1) < nMalla) {
          const item = presentMalla[i - 1];
          mallaLabelHTML = '<td class="malla-label">' + escaparHTML(ETIQUETAS_MALLA[item[0]] || item[0]) + '</td>';
          mallaValorHTML = '<td class="malla-valor">' + escaparHTML(val(ficha, item[0])) + '</td>';
        } else {
          mallaLabelHTML = '<td class="vacia"></td>';
          mallaValorHTML = '<td class="vacia"></td>';
        }

        filasHTML += '<tr>' + labelHTML + valorHTML + mallaLabelHTML + mallaValorHTML + '</tr>';
      }

      if (pesoG1 !== '') {
        filasHTML += '<tr><td class="peso-label">G1</td><td class="peso-valor" colspan="3">' + escaparHTML(pesoG1) + '</td></tr>';
      }
      if (pesoG2 !== '') {
        filasHTML += '<tr><td class="peso-label">G2</td><td class="peso-valor" colspan="3">' + escaparHTML(pesoG2) + '</td></tr>';
      }
      // La Humedad solo se muestra cuando la ficha realmente tiene un
      // valor guardado; si viene vacía, no se agrega ninguna fila.
      if (humedad !== '') {
        filasHTML += '<tr><td class="peso-label">Humedad</td><td class="peso-valor" colspan="3">' + escaparHTML(humedad) + '</td></tr>';
      }
      filasHTML += '<tr><td class="faltas-label">FALTAS</td><td class="faltas-valor" colspan="3">' + escaparHTML(val(ficha, 'faltas')) + '</td></tr>';

      const envoltura = document.createElement('div');
      envoltura.className = 'ficha-envoltura';
      envoltura.innerHTML =
        '<div class="ficha-interior">' +
        '<table class="ficha">' +
        '<colgroup><col class="label"><col class="valor"><col class="malla-l"><col class="malla-v"></colgroup>' +
        '<tbody>' +
        '<tr><td class="muestra" colspan="4">' + escaparHTML(ficha.muestra || '(sin nombre)') + '</td></tr>' +
        filasHTML +
        '</tbody></table></div>';
      return envoltura;
    }

    // Agrupa las fichas por lote (ascendente) y arma, para cada lote, su
    // encabezado "LOTE XXXX" seguido de la cuadrícula de tarjetas.
    // Lista de lotes ya renderizados, en orden, para poder navegar de
    // lote en lote con las flechas ("adelante" / "atrás").
    let lotesElementos = [];
    let loteActualIndice = 0;

    function renderizarInforme(fichas) {
      const contenedor = document.getElementById('contenedorPrincipal');
      contenedor.innerHTML = '';
      lotesElementos = [];
      loteActualIndice = 0;

      if (!fichas || fichas.length === 0) {
        contenedor.innerHTML = '<p class="mensaje-vacio">No hay información para mostrar. Abre este informe desde el botón "Calidades" en Consultar Lotes.</p>';
        return;
      }

      const lotesOrdenados = [];
      const fichasPorLote = new Map();
      fichas.forEach(function(ficha) {
        const lote = (ficha.lote || '(sin lote)').toString();
        if (!fichasPorLote.has(lote)) {
          fichasPorLote.set(lote, []);
          lotesOrdenados.push(lote);
        }
        fichasPorLote.get(lote).push(ficha);
      });
      lotesOrdenados.sort(compararLotesAscendente);

      lotesOrdenados.forEach(function(lote) {
        const grupo = document.createElement('div');
        grupo.className = 'grupo-lote';

        const loteEnvoltura = document.createElement('div');
        loteEnvoltura.className = 'lote-envoltura';
        loteEnvoltura.innerHTML = '<div class="lote-header">LOTE ' + escaparHTML(lote) + '</div>';
        grupo.appendChild(loteEnvoltura);

        const cuadricula = document.createElement('div');
        cuadricula.className = 'cuadricula';
        fichasPorLote.get(lote)
          .slice()
          .sort(function(fichaA, fichaB) {
            return (fichaA.muestra || '').toString().trim()
              .localeCompare((fichaB.muestra || '').toString().trim(), 'es', { numeric: true, sensitivity: 'base' });
          })
          .forEach(function(ficha) {
            cuadricula.appendChild(crearTarjetaFicha(ficha));
          });
        grupo.appendChild(cuadricula);

        contenedor.appendChild(grupo);
        lotesElementos.push({ lote: lote, elemento: grupo });
      });

      mostrarLote(0);
    }

    // Muestra solo el lote en la posición "indice" (de la lista ya
    // ordenada) y oculta el resto. El índice da la vuelta: después del
    // último lote vuelve al primero, y antes del primero salta al
    // último.
    function mostrarLote(indice) {
      if (lotesElementos.length === 0) return;
      const total = lotesElementos.length;
      loteActualIndice = ((indice % total) + total) % total;

      lotesElementos.forEach(function(item, i) {
        item.elemento.classList.toggle('oculta', i !== loteActualIndice);
      });

      // (Se dejó de mostrar el texto "LOTE ... (n de N)" en pantalla.)
    }

    function loteAnterior() {
      mostrarLote(loteActualIndice - 1);
    }

    function loteSiguiente() {
      mostrarLote(loteActualIndice + 1);
    }

    function actualizarEstado(texto) {
      const estado = document.getElementById('estadoInforme');
      if (estado) estado.textContent = texto;
    }

    // Lee las fichas guardadas en localStorage por "Consultar Lotes" (las
    // que estaban en pantalla allá) y las dibuja aquí, sin consultar
    // ninguna base de datos.
    function cargarInforme() {
      let datosGuardados = null;
      try {
        const crudo = localStorage.getItem(CLAVE_LOCALSTORAGE);
        if (crudo) datosGuardados = JSON.parse(crudo);
      } catch (err) {
        console.error('No se pudo leer la información guardada:', err);
      }

      const fichas = (datosGuardados && Array.isArray(datosGuardados.fichas)) ? datosGuardados.fichas : [];

      if (fichas.length === 0) {
        actualizarEstado('No hay información para mostrar. Ábrelo desde el botón "Calidades" en Consultar Lotes.');
        renderizarInforme([]);
        return;
      }

      renderizarInforme(fichas);
    }

    window.addEventListener('DOMContentLoaded', cargarInforme);
  </script>

  <script>
    (function () {
      var btnLupa = document.getElementById('btnLupa');
      var panelZoom = document.getElementById('panelZoom');
      var sliderZoom = document.getElementById('sliderZoom');
      var zoomValor = document.getElementById('zoomValor');
      var contenido = document.querySelector('.contenedor-principal');

      var btnBuscar = document.getElementById('btnBuscar');
      var overlayBuscar = document.getElementById('overlayBuscar');
      var panelBuscar = document.getElementById('panelBuscar');
      var inputBuscar = document.getElementById('inputBuscar');
      var btnCerrarBuscar = document.getElementById('btnCerrarBuscar');
      var buscarInfo = document.getElementById('buscarInfo');

      btnLupa.addEventListener('click', function (e) {
        e.stopPropagation();
        panelZoom.classList.toggle('visible');
        btnLupa.classList.toggle('activo');
        cerrarBuscar();
      });

      sliderZoom.addEventListener('input', function () {
        var valor = sliderZoom.value;
        zoomValor.textContent = valor + '%';
        contenido.style.zoom = (valor / 100);
      });

      function abrirBuscar() {
        overlayBuscar.classList.add('visible');
        btnBuscar.classList.add('activo');
        panelZoom.classList.remove('visible');
        btnLupa.classList.remove('activo');
        inputBuscar.focus();
      }

      function cerrarBuscar() {
        overlayBuscar.classList.remove('visible');
        btnBuscar.classList.remove('activo');
      }

      function ejecutarBusqueda() {
        // Se leen de nuevo en cada búsqueda porque las fichas se dibujan
        // dinámicamente al cargar la página (pueden no existir todavía
        // apenas arranca, y su cantidad de lotes varía según lo que
        // traiga "Consultar Lotes").
        var texto = inputBuscar.value.trim().toLowerCase();
        var totalFichas = document.querySelectorAll('.ficha-envoltura').length;

        if (texto === '') {
          // Sin texto de búsqueda: se vuelve a la vista de un lote a la vez.
          buscarInfo.textContent = '';
          if (typeof mostrarLote === 'function') mostrarLote(loteActualIndice);
          return;
        }

        var visibles = 0;
        (typeof lotesElementos !== 'undefined' ? lotesElementos : []).forEach(function (item) {
          var grupo = item.elemento;
          var header = grupo.querySelector('.lote-header');
          var loteTexto = header ? header.textContent.toLowerCase() : '';
          var coincide = loteTexto.indexOf(texto) !== -1;
          grupo.classList.toggle('oculta', !coincide);
          if (coincide) visibles += grupo.querySelectorAll('.ficha-envoltura').length;
        });

        buscarInfo.textContent = (visibles === 0) ? '' : (visibles + ' de ' + totalFichas);
      }

      btnBuscar.addEventListener('click', function (e) {
        e.stopPropagation();
        if (overlayBuscar.classList.contains('visible')) {
          cerrarBuscar();
        } else {
          abrirBuscar();
        }
      });

      btnCerrarBuscar.addEventListener('click', function (e) {
        e.stopPropagation();
        cerrarBuscar();
      });

      // Búsqueda en vivo mientras se escribe
      inputBuscar.addEventListener('input', ejecutarBusqueda);

      // Enter dentro del campo también ejecuta la búsqueda
      inputBuscar.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          ejecutarBusqueda();
        }
        if (e.key === 'Escape') {
          cerrarBuscar();
        }
      });

      // Clic en el fondo oscuro cierra la ventana flotante
      overlayBuscar.addEventListener('click', function (e) {
        if (e.target === overlayBuscar) {
          cerrarBuscar();
        }
      });

      // Cierra la barra de zoom si se hace clic afuera de ella
      document.addEventListener('click', function (e) {
        if (!panelZoom.contains(e.target) && e.target !== btnLupa && !btnLupa.contains(e.target)) {
          panelZoom.classList.remove('visible');
          btnLupa.classList.remove('activo');
        }
      });
    })();
  </script>

</body>
</html>
