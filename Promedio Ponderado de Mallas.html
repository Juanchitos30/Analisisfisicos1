<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Promedio Ponderado de Mallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #4A90E2;
    --azul-oscuro: #2f6fc4;
    --navy: #24344d;
    --navy-suave: #34495e;
    --gris-texto: #4a4f57;
    --gris-borde: #d7dbe2;
    --etiqueta-fondo: #eaf1fb;
    --etiqueta-texto: #1f3a5f;
    --rojo: #e74c3c;
    --bg: #fff;
    --bg-pagina: #eef1f8;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c2230; --bg-pagina: #11141c; --gris-texto: #c7cbd6;
      --gris-borde: #3a4050; --etiqueta-fondo: #263049; --etiqueta-texto: #bcd2f5;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
    background: var(--bg-pagina);
    min-height: 100%; margin: 0; padding: 28px 14px;
    color: var(--gris-texto); -webkit-font-smoothing: antialiased;
  }
  .card {
    background: var(--bg); padding: 30px 28px; border-radius: 16px;
    box-shadow: 0 14px 36px rgba(30,41,59,0.12); border: 1px solid rgba(0,0,0,0.04);
    width: 100%; max-width: 680px; margin: 0 auto;
  }
  h2 { margin: 0 0 4px; text-align: center; font-size: 21px; font-weight: 700; }
  .subtitulo { margin: 0 0 22px; text-align: center; font-size: 13px; color: #8a90a0; font-weight: 500; }
  label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 600; color: #8a90a0; text-transform: uppercase; letter-spacing: .04em; }
  input[type="text"], input[type="tel"], textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--gris-borde); border-radius: 8px;
    font-size: 14px; color: inherit; background: var(--bg); font-family: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  input[type="text"]:focus, input[type="tel"]:focus, textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(74,144,226,.15); }
  .fila-dos-columnas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .campo { margin-top: 14px; }

  .bloque-producto { margin-top: 22px; border: 1.5px solid var(--gris-borde); border-radius: 12px; padding: 16px; background: var(--bg); }
  .bloque-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .bloque-header span { font-size: 12.5px; font-weight: 700; color: var(--azul-oscuro); text-transform: uppercase; letter-spacing: .05em; }
  .btn-quitar-bloque {
    width: 22px; height: 22px; border: none; border-radius: 50%; background: transparent; color: #9aa1b0;
    font-size: 13px; cursor: pointer;
  }
  .btn-quitar-bloque:hover { background: rgba(231,76,60,.12); color: var(--rojo); }

  .tabla-envoltura { border-radius: 10px; overflow: hidden; border: 1px solid var(--gris-borde); margin-top: 14px; }
  table.grupos { width: 100%; border-collapse: collapse; }
  table.grupos th {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-suave) 100%); color: #fff;
    padding: 8px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  }
  table.grupos th:first-child { text-align: left; }
  table.grupos th:last-child { text-align: center; }
  table.grupos td { border-top: 1px solid var(--gris-borde); padding: 6px 10px; }
  table.grupos tr:first-child td { border-top: none; }
  table.grupos td.etiqueta { background: var(--etiqueta-fondo); color: var(--etiqueta-texto); font-weight: 700; font-size: 12.5px; white-space: nowrap; }
  table.grupos input[type="tel"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--gris-borde); border-radius: 6px;
    font-size: 12.5px; font-family: inherit; text-align: center; background: var(--bg); color: inherit;
  }
  table.grupos input[type="tel"]:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 2px rgba(74,144,226,.15); }
  table.grupos td.resultado { font-weight: 700; color: var(--azul-oscuro); text-align: center; background: var(--etiqueta-fondo); }

  .btn-agregar-bloque {
    width: 100%; margin-top: 18px; padding: 11px; background: transparent; color: var(--azul);
    border: 1.5px dashed var(--azul); border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }
  .btn-agregar-bloque:hover { background: var(--etiqueta-fondo); }

  .seccion-titulo { margin: 28px 0 12px; font-size: 12.5px; font-weight: 800; color: #8a90a0; text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 10px; }
  .seccion-titulo::after { content: ''; flex: 1; height: 1px; background: var(--gris-borde); }
  .resumen { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; color: #8a90a0; font-weight: 600; }
  .resumen span.valor { color: var(--azul-oscuro); font-weight: 700; }

  .btn-imagen {
    width: 100%; margin-top: 18px; padding: 12px; background: var(--azul); color: #fff; border: none;
    border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .btn-imagen svg { flex-shrink: 0; }
  .btn-imagen:hover { background: var(--azul-oscuro); }
  #previewImagen { width: 100%; margin-top: 14px; border-radius: 10px; border: 1px solid var(--gris-borde); display: none; }
  #mensajeImagen { margin-top: 10px; text-align: center; font-size: 12.5px; color: #8a90a0; }

  @media (max-width: 560px) { .fila-dos-columnas { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="card">
  <h2>Promedio Ponderado de Mallas</h2>
  <p class="subtitulo">Pondera el resultado de granulometría por la cantidad de sacos de cada producto</p>

  <div id="contenedorProductos"></div>

  <button type="button" class="btn-agregar-bloque" id="btnAgregarBloque">+ Agregar Mallas</button>

  <div class="seccion-titulo">Resultado</div>
  <div class="resumen">
    <span>Total de sacos</span>
    <span class="valor" id="totalSacos">0</span>
  </div>
  <div class="tabla-envoltura">
    <table class="grupos">
      <tr><th style="width:50%;">Malla</th><th>Promedio ponderado</th></tr>
      <tr><td class="etiqueta">Malla 18</td><td class="resultado" id="res_18">0</td></tr>
      <tr><td class="etiqueta">Malla 17</td><td class="resultado" id="res_17">0</td></tr>
      <tr><td class="etiqueta">Malla 16</td><td class="resultado" id="res_16">0</td></tr>
      <tr><td class="etiqueta">Malla 15</td><td class="resultado" id="res_15">0</td></tr>
      <tr><td class="etiqueta">Malla 14</td><td class="resultado" id="res_14">0</td></tr>
      <tr><td class="etiqueta">Malla 13</td><td class="resultado" id="res_13">0</td></tr>
      <tr><td class="etiqueta">Malla 12</td><td class="resultado" id="res_12">0</td></tr>
      <tr><td class="etiqueta">Fondo</td><td class="resultado" id="res_0">0</td></tr>
    </table>
  </div>

  <div class="campo">
    <label for="observaciones">Observaciones</label>
    <textarea id="observaciones" placeholder="Escribe aquí cualquier observación..."></textarea>
  </div>

  <button type="button" class="btn-imagen" id="btnGenerarImagen">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="3"></rect>
      <circle cx="9" cy="9" r="1.8"></circle>
      <path d="M21 15l-5.5-5.5L5 20"></path>
    </svg>
    Generar imagen
  </button>
  <canvas id="canvasResultado" style="display:none;"></canvas>
  <img id="previewImagen" alt="Resumen de mallas">
  <div id="mensajeImagen"></div>
</div>

<script>
  const MALLAS = ['18','17','16','15','14','13','12','0'];
  const contenedor = document.getElementById('contenedorProductos');
  let contador = 0;

  function etiquetaMalla(m) { return m === '0' ? 'Fondo' : 'Malla ' + m; }
  function mallaDeEtiqueta(etiqueta) { return etiqueta === 'Fondo' ? '0' : etiqueta.replace('Malla ', ''); }

  function filaMalla(m) {
    return '<tr><td class="etiqueta">' + etiquetaMalla(m) + '</td><td><input type="tel" inputmode="decimal" data-malla="' + m + '"></td></tr>';
  }

  function crearBloque() {
    contador++;
    const id = contador;
    const div = document.createElement('div');
    div.className = 'bloque-producto';
    div.dataset.id = id;
    div.innerHTML =
      '<div class="bloque-header"><span>Producto ' + id + '</span>' +
      '<button type="button" class="btn-quitar-bloque" title="Quitar">✕</button></div>' +
      '<div class="fila-dos-columnas">' +
        '<div class="campo"><label>Producto</label><input type="text" class="input-producto"></div>' +
        '<div class="campo"><label>Cantidad de sacos</label><input type="tel" inputmode="decimal" class="input-sacos"></div>' +
      '</div>' +
      '<div class="tabla-envoltura"><table class="grupos">' +
        '<tr><th style="width:50%;">Malla</th><th>Valor</th></tr>' +
        MALLAS.map(filaMalla).join('') +
      '</table></div>';
    contenedor.appendChild(div);
  }

  document.getElementById('btnAgregarBloque').addEventListener('click', crearBloque);

  contenedor.addEventListener('click', function(e) {
    if (e.target.classList.contains('btn-quitar-bloque')) {
      const bloques = contenedor.querySelectorAll('.bloque-producto');
      if (bloques.length <= 1) return; // siempre queda al menos uno
      e.target.closest('.bloque-producto').remove();
      calcular();
    }
  });

  contenedor.addEventListener('input', calcular);

  let ultimoResultado = {};

  function calcular() {
    const bloques = contenedor.querySelectorAll('.bloque-producto');
    let totalSacos = 0;
    const sumasPonderadas = {};
    MALLAS.forEach(function(m) { sumasPonderadas[m] = 0; });

    bloques.forEach(function(bloque) {
      const sacos = parseFloat(bloque.querySelector('.input-sacos').value) || 0;
      totalSacos += sacos;
      MALLAS.forEach(function(m) {
        const input = bloque.querySelector('[data-malla="' + m + '"]');
        const valor = parseFloat(input.value) || 0;
        sumasPonderadas[m] += sacos * valor;
      });
    });

    document.getElementById('totalSacos').textContent = totalSacos;
    ultimoResultado = { totalSacos: totalSacos };
    MALLAS.forEach(function(m) {
      const resultado = totalSacos > 0 ? Math.round((sumasPonderadas[m] / totalSacos) * 100) / 100 : 0;
      document.getElementById('res_' + m).textContent = resultado;
      ultimoResultado[m] = resultado;
    });
  }

  // ==== Generación de imagen horizontal con todos los productos + resultado ====
  function generarImagen() {
    const bloques = Array.from(contenedor.querySelectorAll('.bloque-producto'));
    const filas = ['Sacos'].concat(MALLAS.map(etiquetaMalla));
    const anchoEtiqueta = 110;
    const anchoColumna = 150;
    const altoFila = 32;
    const altoEncabezado = 40;
    const observaciones = document.getElementById('observaciones').value.trim();
    const altoObs = observaciones ? 60 : 0;
    const margen = 24;

    const numColumnas = bloques.length + 1; // + Resultado
    const anchoCanvas = anchoEtiqueta + numColumnas * anchoColumna + margen * 2;
    const altoTabla = altoEncabezado + filas.length * altoFila;
    const altoCanvas = altoTabla + altoObs + margen * 2 + 10;

    const canvas = document.getElementById('canvasResultado');
    canvas.width = anchoCanvas;
    canvas.height = altoCanvas;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, anchoCanvas, altoCanvas);

    const x0 = margen, y0 = margen;

    function celda(x, y, w, h, texto, fondo, color, negrita) {
      ctx.fillStyle = fondo;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#d7dbe2';
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle = color;
      ctx.font = (negrita ? '700 ' : '500 ') + '13px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(texto, x + w / 2, y + h / 2, w - 10);
    }

    // Encabezado: columna de etiquetas + un producto por columna + Resultado
    celda(x0, y0, anchoEtiqueta, altoEncabezado, '', '#24344d', '#fff', true);
    bloques.forEach(function(bloque, i) {
      const nombre = bloque.querySelector('.input-producto').value.trim() || ('Producto ' + (i + 1));
      celda(x0 + anchoEtiqueta + i * anchoColumna, y0, anchoColumna, altoEncabezado, nombre, '#24344d', '#fff', true);
    });
    celda(x0 + anchoEtiqueta + bloques.length * anchoColumna, y0, anchoColumna, altoEncabezado, 'Resultado', '#2f6fc4', '#fff', true);

    // Filas: Sacos + cada malla
    filas.forEach(function(etiqueta, fIdx) {
      const y = y0 + altoEncabezado + fIdx * altoFila;
      celda(x0, y, anchoEtiqueta, altoFila, etiqueta, '#eaf1fb', '#1f3a5f', true);

      bloques.forEach(function(bloque, i) {
        let valor;
        if (etiqueta === 'Sacos') {
          valor = bloque.querySelector('.input-sacos').value.trim() || '0';
        } else {
          const malla = mallaDeEtiqueta(etiqueta);
          valor = bloque.querySelector('[data-malla="' + malla + '"]').value.trim() || '0';
        }
        celda(x0 + anchoEtiqueta + i * anchoColumna, y, anchoColumna, altoFila, valor, '#ffffff', '#1f2430', false);
      });

      let valorResultado;
      if (etiqueta === 'Sacos') {
        valorResultado = String(ultimoResultado.totalSacos || 0);
      } else {
        const malla = mallaDeEtiqueta(etiqueta);
        valorResultado = String(ultimoResultado[malla] !== undefined ? ultimoResultado[malla] : 0);
      }
      celda(x0 + anchoEtiqueta + bloques.length * anchoColumna, y, anchoColumna, altoFila, valorResultado, '#eaf1fb', '#2f6fc4', true);
    });

    if (observaciones) {
      const yObs = y0 + altoTabla + 14;
      ctx.fillStyle = '#8a90a0';
      ctx.font = '600 11px Inter, Arial, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('OBSERVACIONES', x0, yObs);
      ctx.fillStyle = '#4a4f57';
      ctx.font = '400 13px Inter, Arial, sans-serif';
      ctx.fillText(observaciones, x0, yObs + 20, anchoCanvas - margen * 2);
    }

    return canvas;
  }

  document.getElementById('btnGenerarImagen').addEventListener('click', async function() {
    calcular();
    const canvas = generarImagen();
    const img = document.getElementById('previewImagen');
    const mensaje = document.getElementById('mensajeImagen');
    img.src = canvas.toDataURL('image/png');
    img.style.display = 'block';

    canvas.toBlob(async function(blob) {
      try {
        const downloads = await claude.use('downloads');
        if (downloads) {
          mensaje.textContent = 'Guardando imagen...';
          await downloads.save({ filename: 'promedio-ponderado-mallas.png', data: blob });
          mensaje.textContent = 'Imagen guardada.';
        } else {
          mensaje.textContent = 'Imagen generada arriba. Mantén presionada o haz clic derecho para guardarla.';
        }
      } catch (err) {
        mensaje.textContent = 'Imagen generada arriba. Mantén presionada o haz clic derecho para guardarla.';
      }
    }, 'image/png');
  });

  crearBloque();
  calcular();
</script>

</body>
</html>
