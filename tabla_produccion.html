<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Producción</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .toolbar button {
    background: #1e2a44;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }

  .toolbar button:hover { background: #2d3e63; }

  .estado {
    font-size: 13px;
    color: #555;
  }

  .tabla-wrapper {
    overflow-x: auto;
    border: 1px solid #333;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1300px;
    font-size: 13px;
    background: #fff;
  }

  thead th {
    background: #1e2a44;
    color: #ffffff;
    font-weight: bold;
    padding: 8px 10px;
    border: 1px solid #333;
    white-space: nowrap;
    position: sticky;
    top: 0;
  }

  tbody td {
    padding: 6px 10px;
    border: 1px solid #ccc;
    color: #17469e;
    white-space: nowrap;
  }

  tbody tr:nth-child(even) { background: #eef1f6; }
  tbody tr:nth-child(odd)  { background: #ffffff; }

  tbody tr.fila-nueva {
    animation: resaltar 2s ease-out;
  }

  @keyframes resaltar {
    from { background: #fff3b0; }
    to   { background: inherit; }
  }

  .vacio {
    text-align: center;
    padding: 20px;
    color: #888;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnRecargar">Actualizar ahora</button>
  <button onclick="window.location.href='inicio.html'">⬅ Menú principal</button>
  <span class="estado" id="estado">Cargando datos...</span>
</div>

<div class="tabla-wrapper">
  <table>
    <thead>
      <tr>
        <th>Id</th>
        <th>Ubicacion</th>
        <th>Fraccion</th>
        <th>CLIENTE O PTO</th>
        <th>LOTE</th>
        <th>Qty</th>
        <th>PREPARACION</th>
        <th>Obs</th>
        <th>DIAS/PROD</th>
        <th>FECHA</th>
        <th>%H</th>
        <th>IGTotal</th>
        <th>IG Parcial</th>
        <th>II G</th>
        <th>BRP</th>
        <th>FALTAS</th>
        <th>M 18</th>
        <th>M 17</th>
        <th>M 16</th>
        <th>M 15</th>
        <th>M 14</th>
        <th>M 13</th>
        <th>M 12</th>
        <th>0</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
      <tr><td colspan="24" class="vacio">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ============================================================
  // CONFIGURACION: reemplaza con los datos de tu proyecto Supabase
  // (Project Settings -> API)
  // ============================================================
  const SUPABASE_URL = "https://eqbzvxtxvrzrbnbfhslk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xOyo_f01vHWQbXUI9wZuSQ_MW8qH0PD";
  const NOMBRE_TABLA = "registro_produccion";

  const { createClient } = supabase;
  const cliente = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const cuerpoTabla = document.getElementById("cuerpoTabla");
  const estado = document.getElementById("estado");
  const btnRecargar = document.getElementById("btnRecargar");

  // Mapea cada columna visible a la columna real en la base de datos
  const COLUMNAS = [
    "id", "Ubicacion", "Fraccion", "Cliente_o_Pto", "Lote", "Qty",
    "Preparacion", "Obs", "Dias_Prod", "Fecha", "Porcentaje_H",
    "IGTotal", "IG_Parcial", "II_G", "BRP", "FALTAS",
    "M_18", "M_17", "M_16", "M_15", "M_14", "M_13", "M_12", "M_0"
  ];

  function formatearValor(valor) {
    return (valor === null || valor === undefined || valor === "") ? "" : valor;
  }

  function pintarFilas(filas, idsNuevos = []) {
    if (!filas || filas.length === 0) {
      cuerpoTabla.innerHTML = '<tr><td colspan="24" class="vacio">No hay datos todavía.</td></tr>';
      return;
    }

    cuerpoTabla.innerHTML = "";
    filas.forEach(fila => {
      const tr = document.createElement("tr");
      if (idsNuevos.includes(fila.id)) {
        tr.classList.add("fila-nueva");
      }
      COLUMNAS.forEach(col => {
        const td = document.createElement("td");
        td.textContent = formatearValor(fila[col]);
        tr.appendChild(td);
      });
      cuerpoTabla.appendChild(tr);
    });
  }

  async function cargarDatos(idsNuevos = []) {
    estado.textContent = "Cargando datos...";
    const { data, error } = await cliente
      .from(NOMBRE_TABLA)
      .select("*")
      .order("id", { ascending: true });

    if (error) {
      estado.textContent = "Error al cargar: " + error.message;
      console.error(error);
      return;
    }

    pintarFilas(data, idsNuevos);
    estado.textContent = "Actualizado: " + new Date().toLocaleTimeString();
  }

  // Carga inicial
  cargarDatos();

  // Botón manual
  btnRecargar.addEventListener("click", () => cargarDatos());

  // ------------------------------------------------------------
  // Actualización automática en tiempo real: cada vez que se
  // inserta, edita o borra una fila en Supabase, esta tabla se
  // refresca sola sin que el usuario haga nada.
  // Requiere tener Realtime habilitado para esta tabla en Supabase
  // (Database -> Replication -> activar la tabla).
  // ------------------------------------------------------------
  cliente
    .channel("cambios-registro-produccion")
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: NOMBRE_TABLA },
      (payload) => {
        const idNuevo = payload.new && payload.new.id ? [payload.new.id] : [];
        cargarDatos(idNuevo);
      }
    )
    .subscribe();

  // Respaldo: si por algún motivo realtime no está activado,
  // igual refresca cada 30 segundos.
  setInterval(() => cargarDatos(), 30000);
</script>

</body>
</html>
