<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Producción</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .toolbar button {
    background: #1e2a44;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }

  .toolbar button:hover { background: #2d3e63; }

  .toolbar button.excel { background: #1e7a3c; }
  .toolbar button.excel:hover { background: #26983f; }

  .estado {
    font-size: 13px;
    color: #555;
  }

  .tabla-wrapper {
    overflow-x: auto;
    border: 1px solid #333;
  }

  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1300px;
    font-size: 13px;
    background: #fff;
  }

  thead th {
    background: #1e2a44;
    color: #ffffff;
    font-weight: bold;
    padding: 8px 10px;
    border: 1px solid #333;
    white-space: nowrap;
    position: sticky;
    top: 0;
    text-transform: uppercase;
  }

  tbody td {
    padding: 6px 10px;
    border: 1px solid #ccc;
    color: #000000;
    white-space: nowrap;
  }

  tbody tr:nth-child(even) { background: #eef1f6; }
  tbody tr:nth-child(odd)  { background: #ffffff; }

  tbody tr.fila-nueva {
    animation: resaltar 2s ease-out;
  }

  @keyframes resaltar {
    from { background: #fff3b0; }
    to   { background: inherit; }
  }

  .vacio {
    text-align: center;
    padding: 20px;
    color: #888;
  }

  td.col-acciones, th.col-acciones {
    position: sticky;
    right: 0;
    background: #1e2a44;
  }

  tbody td.col-acciones {
    background: #f8f9fb;
  }

  .btn-accion {
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-right: 4px;
  }

  .btn-editar   { background: #f0ad4e; color: #fff; }
  .btn-editar:hover   { background: #ec9c2e; }
  .btn-guardar  { background: #1e7a3c; color: #fff; }
  .btn-guardar:hover  { background: #26983f; }
  .btn-cancelar { background: #a33; color: #fff; }
  .btn-cancelar:hover { background: #c33; }

  tbody td input {
    width: 90px;
    font-size: 12px;
    padding: 2px 4px;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnRecargar">Actualizar ahora</button>
  <button id="btnDescargarExcel" class="excel">Descargar Excel</button>
  <span class="estado" id="estado">Cargando datos...</span>
</div>

<div class="tabla-wrapper">
  <table>
    <thead>
      <tr id="filaEncabezados">
        <th>Cargando columnas...</th>
      </tr>
    </thead>
    <tbody id="cuerpoTabla">
      <tr><td class="vacio">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<script>
  // ============================================================
  // CONFIGURACION: reemplaza con los datos de tu proyecto Supabase
  // (Project Settings -> API)
  // ============================================================
  const SUPABASE_URL = "https://eqbzvxtxvrzrbnbfhslk.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_xOyo_f01vHWQbXUI9wZuSQ_MW8qH0PD";
  const NOMBRE_TABLA = "registro_produccion";
  const COLUMNA_ID = "id"; // nombre real de la columna llave primaria en Supabase

  const { createClient } = supabase;
  const cliente = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const cuerpoTabla = document.getElementById("cuerpoTabla");
  const filaEncabezados = document.getElementById("filaEncabezados");
  const estado = document.getElementById("estado");
  const btnRecargar = document.getElementById("btnRecargar");
  const btnDescargarExcel = document.getElementById("btnDescargarExcel");

  // ------------------------------------------------------------
  // Antes, las columnas venían escritas "a mano" (COLUMNAS = [...])
  // y tenían que coincidir EXACTAMENTE (mayúsculas/minúsculas
  // incluidas) con los nombres reales de columnas en Supabase.
  // Como no coincidían, solo aparecía el "id" (la única que sí
  // coincidía) y el resto salía vacío.
  //
  // Ahora las columnas se detectan automáticamente a partir de los
  // datos que realmente devuelve Supabase, así que siempre se ven
  // sin importar cómo estén escritas en la base de datos.
  // ------------------------------------------------------------

  // Etiquetas "bonitas" opcionales para mostrar en el encabezado.
  // La clave debe estar en minúsculas y sin espacios/símbolos.
  const ETIQUETAS = {
    id: "Id",
    ubicacion: "Ubicacion",
    fraccion: "Fraccion",
    clienteopto: "CLIENTE O PTO",
    lote: "LOTE",
    qty: "Qty",
    preparacion: "PREPARACION",
    obs: "Obs",
    diasprod: "DIAS/PROD",
    fecha: "FECHA",
    porcentajeh: "%H",
    h: "%H",
    igtotal: "IGTotal",
    igparcial: "IG Parcial",
    iig: "II G",
    brp: "BRP",
    faltas: "FALTAS",
    m18: "M 18",
    m17: "M 17",
    m16: "M 16",
    m15: "M 15",
    m14: "M 14",
    m13: "M 13",
    m12: "M 12",
    m0: "0"
  };

  function normalizar(txt) {
    return String(txt).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function obtenerEtiqueta(clave) {
    return ETIQUETAS[normalizar(clave)] || clave;
  }

  // ------------------------------------------------------------
  // Orden fijo en el que se deben mostrar las columnas, sin
  // importar el orden en que Supabase las devuelva. Las claves
  // están normalizadas (minúsculas, sin espacios ni símbolos).
  // Cualquier columna que llegue y no esté en esta lista se
  // agrega al final, después de todas las conocidas.
  // ------------------------------------------------------------
  const ORDEN_COLUMNAS = [
    "id",
    "fecha",
    "ubicacion",
    "fraccion",
    "qty",
    "clienteopto",
    "lote",
    "preparacion",
    "obs",
    "porcentajeh",
    "h",
    "faltas",
    "igtotal",
    "igparcial",
    "iig",
    "brp",
    "m18",
    "m17",
    "m16",
    "m15",
    "m14",
    "m13",
    "m12",
    "m0"
  ];

  function ordenarClaves(claves) {
    return [...claves].sort((a, b) => {
      const posA = ORDEN_COLUMNAS.indexOf(normalizar(a));
      const posB = ORDEN_COLUMNAS.indexOf(normalizar(b));
      const rangoA = posA === -1 ? ORDEN_COLUMNAS.length : posA;
      const rangoB = posB === -1 ? ORDEN_COLUMNAS.length : posB;
      return rangoA - rangoB;
    });
  }

  // ------------------------------------------------------------
  // Columnas que existen en Supabase pero que NO se deben mostrar
  // en esta tabla (siguen guardadas en la base de datos, solo se
  // ocultan de la vista). Usar la clave normalizada.
  // ------------------------------------------------------------
  const COLUMNAS_OCULTAS = ["diasprod"];

  function filtrarOcultas(claves) {
    return claves.filter(clave => !COLUMNAS_OCULTAS.includes(normalizar(clave)));
  }

  let columnasActuales = [];  // [{clave, etiqueta}]
  let ultimasFilas = [];      // datos crudos cargados de Supabase
  let filaEnEdicion = null;   // id de la fila que se está editando

  function pintarEncabezados() {
    filaEncabezados.innerHTML = "";
    columnasActuales.forEach(col => {
      const th = document.createElement("th");
      th.textContent = col.etiqueta;
      filaEncabezados.appendChild(th);
    });
    const thAcciones = document.createElement("th");
    thAcciones.textContent = "Acciones";
    thAcciones.className = "col-acciones";
    filaEncabezados.appendChild(thAcciones);
  }

  function formatearValor(valor) {
    return (valor === null || valor === undefined || valor === "") ? "" : valor;
  }

  function pintarFilas(filas, idsNuevos = []) {
    const colspanTotal = columnasActuales.length + 1;

    if (!filas || filas.length === 0) {
      cuerpoTabla.innerHTML = `<tr><td colspan="${colspanTotal}" class="vacio">No hay datos todavía.</td></tr>`;
      return;
    }

    cuerpoTabla.innerHTML = "";
    filas.forEach(fila => {
      const tr = document.createElement("tr");
      tr.dataset.id = fila[COLUMNA_ID];
      if (idsNuevos.includes(fila[COLUMNA_ID])) {
        tr.classList.add("fila-nueva");
      }

      if (filaEnEdicion === fila[COLUMNA_ID]) {
        pintarFilaEdicion(tr, fila);
      } else {
        pintarFilaNormal(tr, fila);
      }

      cuerpoTabla.appendChild(tr);
    });
  }

  function pintarFilaNormal(tr, fila) {
    columnasActuales.forEach(col => {
      const td = document.createElement("td");
      td.textContent = formatearValor(fila[col.clave]);
      tr.appendChild(td);
    });

    const tdAcciones = document.createElement("td");
    tdAcciones.className = "col-acciones";
    const btnEditar = document.createElement("button");
    btnEditar.textContent = "Editar";
    btnEditar.className = "btn-accion btn-editar";
    btnEditar.addEventListener("click", () => {
      filaEnEdicion = fila[COLUMNA_ID];
      pintarFilas(ultimasFilas);
    });
    tdAcciones.appendChild(btnEditar);
    tr.appendChild(tdAcciones);
  }

  // ------------------------------------------------------------
  // Pegado estilo Excel: si el usuario copia varias celdas seguidas
  // (por ejemplo desde Excel: "1<TAB>5<TAB>31<TAB>28") y las pega en
  // un input de la fila en edición, los valores se reparten
  // automáticamente en ese input y en los siguientes, en el mismo
  // orden de las columnas de la tabla.
  // ------------------------------------------------------------
  function separarValoresPegados(texto) {
    // Excel copia las celdas separadas por tabulaciones.
    // Si además se copiaron varias filas, cada fila viene separada
    // por salto de línea: solo tomamos la primera fila pegada.
    const primeraFila = texto.split(/\r\n|\r|\n/)[0];
    let valores = primeraFila.split("\t");

    // Si no había tabulaciones reales (por ejemplo se pegó texto
    // separado con espacios), lo separamos por espacios múltiples.
    if (valores.length === 1) {
      valores = primeraFila.trim().split(/\s+/);
    }

    return valores.map(v => v.trim());
  }

  function manejarPegadoExcel(evento, inputActual, tr) {
    const texto = (evento.clipboardData || window.clipboardData).getData("text");
    const valores = separarValoresPegados(texto);

    // Si solo hay un valor, dejamos que el navegador lo pegue normal.
    if (valores.length <= 1) return;

    evento.preventDefault();

    const inputsFila = Array.from(tr.querySelectorAll("input[data-clave]"));
    const indiceInicial = inputsFila.indexOf(inputActual);
    if (indiceInicial === -1) return;

    valores.forEach((valor, i) => {
      const input = inputsFila[indiceInicial + i];
      if (input) input.value = valor;
    });
  }

  function pintarFilaEdicion(tr, fila) {
    columnasActuales.forEach(col => {
      const td = document.createElement("td");
      if (col.clave === COLUMNA_ID) {
        // El id no se edita
        td.textContent = formatearValor(fila[col.clave]);
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.value = formatearValor(fila[col.clave]);
        input.dataset.clave = col.clave;
        input.addEventListener("paste", (evento) => manejarPegadoExcel(evento, input, tr));
        td.appendChild(input);
      }
      tr.appendChild(td);
    });

    const tdAcciones = document.createElement("td");
    tdAcciones.className = "col-acciones";

    const btnGuardar = document.createElement("button");
    btnGuardar.textContent = "Guardar";
    btnGuardar.className = "btn-accion btn-guardar";
    btnGuardar.addEventListener("click", () => guardarFila(tr, fila));
    tdAcciones.appendChild(btnGuardar);

    const btnCancelar = document.createElement("button");
    btnCancelar.textContent = "Cancelar";
    btnCancelar.className = "btn-accion btn-cancelar";
    btnCancelar.addEventListener("click", () => {
      filaEnEdicion = null;
      pintarFilas(ultimasFilas);
    });
    tdAcciones.appendChild(btnCancelar);

    tr.appendChild(tdAcciones);
  }

  async function guardarFila(tr, fila) {
    const inputs = tr.querySelectorAll("input[data-clave]");
    const cambios = {};
    inputs.forEach(input => {
      let valor = input.value;
      // Si el campo estaba vacío antes y sigue vacío, mándalo como null
      if (valor === "") valor = null;
      cambios[input.dataset.clave] = valor;
    });

    estado.textContent = "Guardando...";

    const { error } = await cliente
      .from(NOMBRE_TABLA)
      .update(cambios)
      .eq(COLUMNA_ID, fila[COLUMNA_ID]);

    if (error) {
      estado.textContent = "Error al guardar: " + error.message;
      console.error(error);
      alert("No se pudo guardar el cambio: " + error.message);
      return;
    }

    filaEnEdicion = null;
    await cargarDatos();
  }

  async function descargarExcel() {
    if (!ultimasFilas || ultimasFilas.length === 0) {
      alert("No hay datos para descargar todavía.");
      return;
    }

    const libro = new ExcelJS.Workbook();
    const hoja = libro.addWorksheet("Produccion");

    // Columnas: mismo orden que la tabla en pantalla, encabezado en mayúsculas
    hoja.columns = columnasActuales.map(col => ({
      header: String(col.etiqueta).toUpperCase(),
      key: col.clave,
      width: Math.max(10, String(col.etiqueta).length + 4)
    }));

    ultimasFilas.forEach(fila => {
      const filaExcel = {};
      columnasActuales.forEach(col => {
        filaExcel[col.clave] = formatearValor(fila[col.clave]);
      });
      hoja.addRow(filaExcel);
    });

    // Encabezado: fondo azul marino, texto blanco, negrita (igual que la tabla)
    const filaEncabezado = hoja.getRow(1);
    filaEncabezado.eachCell(celda => {
      celda.font = { bold: true, color: { argb: "FFFFFFFF" } };
      celda.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1E2A44" } };
      celda.alignment = { vertical: "middle", horizontal: "center" };
      celda.border = {
        top: { style: "thin", color: { argb: "FF333333" } },
        left: { style: "thin", color: { argb: "FF333333" } },
        bottom: { style: "thin", color: { argb: "FF333333" } },
        right: { style: "thin", color: { argb: "FF333333" } }
      };
    });
    filaEncabezado.height = 20;

    // Filas de datos: texto negro, filas alternadas (igual que la tabla)
    for (let i = 2; i <= hoja.rowCount; i++) {
      const fila = hoja.getRow(i);
      const esPar = i % 2 === 0;
      fila.eachCell({ includeEmpty: true }, celda => {
        celda.font = { color: { argb: "FF000000" } };
        celda.fill = {
          type: "pattern",
          pattern: "solid",
          fgColor: { argb: esPar ? "FFEEF1F6" : "FFFFFFFF" }
        };
        celda.border = {
          top: { style: "thin", color: { argb: "FFCCCCCC" } },
          left: { style: "thin", color: { argb: "FFCCCCCC" } },
          bottom: { style: "thin", color: { argb: "FFCCCCCC" } },
          right: { style: "thin", color: { argb: "FFCCCCCC" } }
        };
      });
    }

    hoja.views = [{ state: "frozen", ySplit: 1 }];

    const buffer = await libro.xlsx.writeBuffer();
    const blob = new Blob([buffer], {
      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    });

    const fechaArchivo = new Date().toISOString().slice(0, 10);
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement("a");
    enlace.href = url;
    enlace.download = `registro_produccion_${fechaArchivo}.xlsx`;
    document.body.appendChild(enlace);
    enlace.click();
    document.body.removeChild(enlace);
    URL.revokeObjectURL(url);
  }

  async function cargarDatos(idsNuevos = []) {
    estado.textContent = "Cargando datos...";
    const { data, error } = await cliente
      .from(NOMBRE_TABLA)
      .select("*")
      .order(COLUMNA_ID, { ascending: true });

    if (error) {
      estado.textContent = "Error al cargar: " + error.message;
      console.error(error);
      return;
    }

    ultimasFilas = data || [];

    // Detecta las columnas reales la primera vez que llegan datos
    // (o si vienen columnas nuevas que antes no existían)
    if (ultimasFilas.length > 0) {
      const clavesReales = filtrarOcultas(Object.keys(ultimasFilas[0]));
      const clavesActuales = columnasActuales.map(c => c.clave);
      const sonDistintas =
        clavesReales.length !== clavesActuales.length ||
        clavesReales.some(c => !clavesActuales.includes(c));

      if (sonDistintas) {
        const clavesOrdenadas = ordenarClaves(clavesReales);
        columnasActuales = clavesOrdenadas.map(clave => ({
          clave,
          etiqueta: obtenerEtiqueta(clave)
        }));
        pintarEncabezados();
      }
    }

    pintarFilas(ultimasFilas, idsNuevos);
    estado.textContent = "Actualizado: " + new Date().toLocaleTimeString();
  }

  // Carga inicial
  cargarDatos();

  // Botón manual
  btnRecargar.addEventListener("click", () => cargarDatos());
  btnDescargarExcel.addEventListener("click", () => descargarExcel());

  // ------------------------------------------------------------
  // Actualización automática en tiempo real: cada vez que se
  // inserta, edita o borra una fila en Supabase, esta tabla se
  // refresca sola sin que el usuario haga nada.
  // Requiere tener Realtime habilitado para esta tabla en Supabase
  // (Database -> Replication -> activar la tabla).
  // ------------------------------------------------------------
  cliente
    .channel("cambios-registro-produccion")
    .on(
      "postgres_changes",
      { event: "*", schema: "public", table: NOMBRE_TABLA },
      (payload) => {
        const idNuevo = payload.new && payload.new[COLUMNA_ID] ? [payload.new[COLUMNA_ID]] : [];
        cargarDatos(idNuevo);
      }
    )
    .subscribe();

  // Respaldo: si por algún motivo realtime no está activado,
  // igual refresca cada 30 segundos (a menos que se esté editando).
  setInterval(() => {
    if (filaEnEdicion === null) cargarDatos();
  }, 30000);
</script>

</body>
</html>
